<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>أنس القرني · صيانة</title>
    <meta name="description" content="الموقع في صيانة الآن، ويعود قريباً." />
    <meta name="theme-color" content="#e0c6ad" />
    <link rel="canonical" href="https://anas.studio/" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="preload" href="/fonts/thmanyah/thmanyahserifdisplay-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/thmanyah/thmanyahsans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/v/c/style.css" />
  </head>
  <body>
    <!-- One wall, one floor, one door. The door stands open on Anas at his table:
         the wall greets, the saffron leaf says when, the floor signs it. -->
    <main class="stage maint">
      <p class="greet">أعود قريباً</p>
      <span class="sig" role="img" aria-label="توقيع أنس القرني"></span>

      <div class="door">
        <span class="leaf leaf-saffron" aria-hidden="true"></span>
        <div class="opening">
          <img
            class="photo"
            src="/images/v2/anas-portrait-720.webp"
            srcset="
              /images/v2/anas-portrait-360.webp   360w,
              /images/v2/anas-portrait-720.webp   720w,
              /images/v2/anas-portrait-1200.webp 1200w,
              /images/v2/anas-portrait-1350.webp 1350w
            "
            sizes="(min-width: 820px) and (min-aspect-ratio: 1/1) and (min-height: 560px) 31vw, 72vw"
            width="1350"
            height="2400"
            alt="أنس القرني جالساً إلى طاولة منخفضة، أمامه دفتر وقلم وأكواب مينا"
            fetchpriority="high"
            decoding="async"
          />
        </div>
        <span class="leaf leaf-coral" aria-hidden="true"></span>
        <p class="soon">صيانة</p>
      </div>

      <div class="host">
        <!-- The name is one text node: «أنس القرني» is a one-word edit here and in <title>. -->
        <h1 class="name">أنس القرني</h1>
        <p class="line">أبني الأفكار والأماكن والحكايات</p>
      </div>

      <div class="foot">
        <nav class="find" aria-labelledby="find-label">
          <p id="find-label">تجدني هنا:</p>
          <ul>
            <li><a href="https://www.instagram.com/anasa.aq">إنستغرام</a></li>
            <li><a href="https://www.tiktok.com/@anasa.aq">تيك توك</a></li>
            <li><a href="https://www.snapchat.com/add/anasa.aq">سناب شات</a></li>
          </ul>
        </nav>
        <p class="domain" dir="ltr" lang="en">anas.studio</p>
      </div>
    </main>
  </body>
</html>
