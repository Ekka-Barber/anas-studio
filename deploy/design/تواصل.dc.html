<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  componentDidMount() {
    this._c = [];
    const nav = document.querySelector('[data-nav]'), bar = document.querySelector('[data-progress]');
    let t = false;
    const raf = () => {
      t = false; const y = scrollY, vh = innerHeight;
      if (nav) { const on = y > 30; nav.style.background = on ? 'rgba(244,236,224,.88)' : 'rgba(244,236,224,0)'; nav.style.borderBottomColor = on ? '#D9C9B4' : 'transparent'; nav.style.backdropFilter = on ? 'blur(12px)' : 'none'; nav.style.webkitBackdropFilter = on ? 'blur(12px)' : 'none'; nav.style.padding = on ? '13px 56px' : '22px 56px'; }
      if (bar) { const h = document.documentElement.scrollHeight - vh; bar.style.width = (h > 0 ? y / h * 100 : 0) + '%'; }
    };
    const os = () => { if (!t) { t = true; requestAnimationFrame(raf); } };
    addEventListener('scroll', os, { passive: true }); raf();
    this._c.push(() => removeEventListener('scroll', os));
  }
  componentWillUnmount() { (this._c || []).forEach(f => f()); }
  renderVals() { return {}; }
}
</script>
