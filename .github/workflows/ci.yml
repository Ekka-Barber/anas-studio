name: CI

# Linux CI. Every step is a real check:
# no step is allowed to fail silently, nothing is wrapped in `continue-on-error`
# and no exit code is masked. A red job means the commit is not acceptable.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install, lint, typecheck, test, static export
    # Pinned image, not `ubuntu-latest`: the runner is part of the build inputs.
    runs-on: ubuntu-24.04
    # The database step below adds several minutes to the build.
    timeout-minutes: 45

    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to point
      # at different code, a commit SHA cannot. The comment records which
      # release each SHA was resolved from, on 2026-09-22.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # Version comes from the `packageManager` field in package.json, which is
        # the single source of truth for the package manager version.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        # `--frozen-lockfile` fails rather than silently resolving a different
        # dependency graph than the committed lockfile.
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Frozen design sources unchanged
        run: pnpm check:frozen

      - name: Copy rules
        run: pnpm check:copy

      - name: Install Deno
        # Pinned to the version the Edge Functions were last type-checked with.
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5, resolved on 2026-10-01
        with:
          deno-version: 2.9.6

      # The Edge Functions run on Deno (D32), which `pnpm typecheck` does not see.
      # Each one is checked against its own deno.json import map; a function
      # without one fails the step, so none can be skipped.
      - name: Type check the Edge Functions
        run: |
          for index in supabase/functions/*/index.ts; do
            deno check --no-lock --config "$(dirname "$index")/deno.json" "$index"
          done

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.106.0

      # The static export reads published content at build time (P04, D29,
      # D32), so the local stack must be up before `pnpm build`. Postgres, the
      # Data API (postgrest/kong) and Auth (gotrue) serve the build; the
      # Storage API is started too because the migrations create the media
      # buckets in its schema. Everything else is excluded to keep the job
      # fast.
      - name: Start the local Supabase stack
        run: supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Import content into the local database
        run: pnpm db:import
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Write .env.local from the local stack
        run: pnpm db:env

      - name: Build the static site
        # `output: 'export'` (D32): the files Cloudflare Pages serves, in out/.
        run: pnpm build

      - name: Static export is complete and holds no secret
        run: pnpm check:export

      - name: Public JavaScript budget
        run: pnpm check:budgets

      # The database invariants (RLS and grants, the checkout, payment, refund
      # and order SQL, the audit trail) against the stack started above. Every
      # integration file runs except the eight that call a served Edge Function:
      # this job starts no edge runtime, no Mailpit and no Moyasar emulator.
      - name: Database invariants (the files that need no edge runtime)
        run: pnpm exec vitest run --mode db --exclude "tests/integration/{staff-admin,checkout-http,disputes-http,notify-http,orders-http,payment-http,refunds-http,order-emails}.test.ts"
        env:
          TEST_ENV: local
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

# What runs where. Here, on every push: the unit tests, the static export and
# its checks, and every database integration file except the eight above,
# against the local stack this job starts (Postgres, the Data API, Auth,
# Storage). Only locally, against the whole disposable Docker stack (see
# docs/development.md): those eight HTTP files (staff-admin, checkout-http,
# disputes-http, notify-http, orders-http, payment-http, refunds-http,
# order-emails), which need the edge runtime, and the Playwright suites
# (`pnpm test:e2e`), which also need Mailpit, the Moyasar emulator and a
# browser. Nothing runs against the hosted site: vitest.config.ts refuses a
# database that is not local, and the specs refuse a `supabase status` that
# is not local.
